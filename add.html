<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add expense | Spendly</title><link rel="stylesheet" href="add.css"></head>
<body><header class="top"><b>Spendly</b><nav><a href="dashboard.html">Dashboard</a><a href="add.html" class="on">Add expense</a><a href="expenses.html">All expenses</a><a href="budget.html">Budget and reports</a></nav><button id="logout">Log out</button></header>
<main class="page">
<h1>Add an expense</h1><p class="sub">Log what you spent as soon as you spend it.</p>
<form id="form" novalidate>
<label>What did you buy?<input id="title" required></label>
<div class="row2"><label>Amount (₹)<input id="amount" type="number" min="1" step="0.01" required></label>
<label>Date<input id="date" type="date" required></label></div>
<label>Category<select id="cat"></select></label>
<label>Note (optional)<textarea id="note" rows="2"></textarea></label>
<p class="msg" id="msg" role="alert"></p>
<button>Save expense</button></form>
</main>
<script src="add.js"></script></body></html>
