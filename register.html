<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account | Spendly</title><link rel="stylesheet" href="register.css"></head>
<body><div class="auth"><aside><h1>Know where your money goes.</h1><div class="demo"><div>Food<i style="width:80%"></i></div><div>Travel<i style="width:45%"></i></div><div>Bills<i style="width:65%"></i></div></div></aside>
<main><form id="form" novalidate>
<h2>Create your account</h2>
<label>Full name<input id="name" autocomplete="name" required></label>
<label>Email<input id="email" type="email" autocomplete="email" required></label>
<label>Password<input id="password" type="password" autocomplete="new-password" required></label>
<label>Confirm password<input id="confirm" type="password" autocomplete="new-password" required></label>
<p class="msg" id="msg" role="alert"></p>
<button>Create account</button>
<p>Already registered? <a href="login.html">Log in</a></p>
</form></main></div>
<script src="register.js"></script></body></html>
