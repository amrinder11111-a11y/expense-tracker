<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | Spendly</title><link rel="stylesheet" href="login.css"></head>
<body><div class="auth"><aside><h1>Know where your money goes.</h1><div class="demo"><div>Food<i style="width:80%"></i></div><div>Travel<i style="width:45%"></i></div><div>Bills<i style="width:65%"></i></div></div></aside>
<main><form id="form" novalidate>
<h2>Log in</h2>
<label>Email<input id="email" type="email" autocomplete="email" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<p class="msg" id="msg" role="alert"></p>
<button>Log in</button>
<p class="hint">New here? <a href="register.html">Create an account</a></p>
</form></main></div>
<script src="login.js"></script></body></html>
